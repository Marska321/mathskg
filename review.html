<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Forge - Human Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen font-sans">

    <div class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="p-6 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-800">Lumen Forge</h1>
            <p class="text-xs text-gray-500 mt-1">Template Review Gate</p>
        </div>
        <div id="skill-list" class="flex-1 overflow-y-auto p-4 space-y-2">
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div class="p-8 flex-1 overflow-y-auto" id="preview-stage">
            <div class="text-center text-gray-400 mt-20">
                <p>Select a template from the sidebar to begin human review.</p>
            </div>
        </div>
    </div>

    <div class="w-80 bg-white border-l border-gray-200 flex flex-col">
        <div class="p-6 border-b border-gray-200 bg-gray-900 text-white">
            <h2 class="font-bold tracking-wide text-sm uppercase">Review Checklist</h2>
        </div>
        <div class="p-6 flex-1 flex flex-col gap-4">
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="chk-math"
                    class="form-checkbox h-5 w-5 text-green-500 rounded border-gray-300 review-chk" disabled>
                <span class="text-gray-700 font-medium">Math is Correct</span>
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="chk-format"
                    class="form-checkbox h-5 w-5 text-green-500 rounded border-gray-300 review-chk" disabled>
                <span class="text-gray-700 font-medium">Clear Formatting</span>
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="chk-distract"
                    class="form-checkbox h-5 w-5 text-green-500 rounded border-gray-300 review-chk" disabled>
                <span class="text-gray-700 font-medium">Good Distractors</span>
            </label>

            <div class="mt-auto">
                <button id="btn-approve" disabled
                    class="w-full py-4 font-bold text-white bg-gray-300 cursor-not-allowed rounded uppercase tracking-wider transition-colors">
                    Approve
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentSkill = null;

        // Load skills on boot
        async function loadSkills() {
            const res = await fetch('/api/admin/skills');
            const data = await res.json();
            const list = document.getElementById('skill-list');
            list.innerHTML = '';

            data.skills.forEach(skill => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 py-3 rounded-md border border-gray-200 hover:border-gray-400 font-mono text-sm bg-white shadow-sm transition-all";
                btn.innerText = skill;
                btn.onclick = () => loadPreview(skill);
                list.appendChild(btn);
            });
        }

        // Load 3 previews for the selected skill
        async function loadPreview(skillId) {
            currentSkill = skillId;
            const stage = document.getElementById('preview-stage');
            stage.innerHTML = `<p class="text-gray-500 text-center mt-10">Generating 3 variations for ${skillId}...</p>`;

            // Enable checkboxes
            document.querySelectorAll('.review-chk').forEach(chk => {
                chk.disabled = false;
                chk.checked = false;
            });
            updateApproveButton();

            const res = await fetch(`/api/admin/preview/${skillId}`);
            const data = await res.json();

            stage.innerHTML = `<h2 class="text-2xl font-bold mb-6 font-mono text-gray-800">Template: ${skillId}</h2>`;

            data.previews.forEach((p, index) => {
                // Find correct answer index
                const correctHtml = p.options.map(opt => {
                    const isCorrect = opt === p.correct_answer;
                    const styles = isCorrect ? "border-green-500 bg-green-50 text-green-800 font-bold" : "border-gray-200 text-gray-600";
                    return `<div class="px-4 py-3 border-2 rounded ${styles}">${opt}</div>`;
                }).join('');

                const hintsHtml = p.hints.map((hint, i) => `<li class="text-sm text-gray-600 mb-1">Step ${i + 1}: ${hint}</li>`).join('');

                stage.innerHTML += `
                    <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm mb-6">
                        <div class="text-xs font-mono text-gray-400 mb-4 uppercase tracking-wider">Seed: ${p.seed}</div>
                        <div class="text-lg font-medium text-gray-900 mb-6 bg-yellow-50 inline-block px-2">${p.question_text}</div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                            ${correctHtml}
                        </div>
                        
                        <div class="bg-gray-50 p-4 rounded-md border border-gray-100">
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">I Do / We Do Logic:</h4>
                            <ul class="list-disc pl-5">${hintsHtml}</ul>
                        </div>
                    </div>
                `;
            });
        }

        // Checkbox Logic
        document.querySelectorAll('.review-chk').forEach(chk => {
            chk.addEventListener('change', updateApproveButton);
        });

        function updateApproveButton() {
            const allChecked = Array.from(document.querySelectorAll('.review-chk')).every(c => c.checked);
            const btn = document.getElementById('btn-approve');
            if (allChecked && currentSkill) {
                btn.disabled = false;
                btn.className = "w-full py-4 font-bold text-white bg-green-500 hover:bg-green-600 rounded uppercase tracking-wider transition-colors shadow-lg";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-4 font-bold text-white bg-gray-300 cursor-not-allowed rounded uppercase tracking-wider transition-colors";
            }
        }

        // Approve Action
        document.getElementById('btn-approve').addEventListener('click', async () => {
            const btn = document.getElementById('btn-approve');
            btn.innerText = "APPROVING...";

            await fetch(`/api/admin/approve/${currentSkill}`, { method: 'POST' });

            btn.className = "w-full py-4 font-bold text-white bg-gray-800 rounded uppercase tracking-wider";
            btn.innerText = "APPROVED";

            setTimeout(() => {
                document.querySelectorAll('.review-chk').forEach(chk => chk.checked = false);
                updateApproveButton();
                btn.innerText = "Approve";
            }, 2000);
        });

        loadSkills();
    </script>
</body>

</html>
